<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Ruangan</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --me:#2563eb; --me-text:#fff; --other:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --card:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --accent:#3b82f6; --me:#3b82f6; --me-text:#fff; --other:#374151; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  .screen { display:none; height:100%; }
  .screen.active { display:flex; }
  #login { align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--card); padding:24px; border-radius:16px; width:100%; max-width:380px; box-shadow:0 4px 20px rgba(0,0,0,.1); }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:14px; }
  input { width:100%; padding:12px; margin-bottom:12px; border:1px solid var(--other); border-radius:10px; font-size:16px; background:var(--bg); color:var(--text); }
  button { padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; }
  button.full { width:100%; }
  button.link { background:none; color:var(--accent); padding:0 0 12px; font-size:14px; }
  #err { color:#dc2626; font-size:14px; min-height:20px; margin-top:8px; }
  #chat { flex-direction:column; }
  header { padding:12px 16px; background:var(--card); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--other); gap:8px; }
  header b { font-size:16px; }
  header small { display:block; color:var(--muted); font-size:12px; }
  header .btns { display:flex; gap:8px; }
  header button { padding:8px 12px; font-size:14px; }
  #leaveBtn { background:#dc2626; }
  #membersBtn { background:var(--other); color:var(--text); }
  #members { display:none; background:var(--card); border-bottom:1px solid var(--other); padding:8px 16px; max-height:35%; overflow-y:auto; }
  #members.open { display:block; }
  .mem { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:15px; }
  .mem small { color:var(--muted); }
  .mem button { padding:4px 10px; font-size:13px; background:#dc2626; }
  #msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:80%; padding:8px 12px; border-radius:14px; background:var(--other); word-wrap:break-word; white-space:pre-wrap; }
  .m .n { font-size:12px; color:var(--muted); margin-bottom:2px; }
  .m.me { align-self:flex-end; background:var(--me); color:var(--me-text); }
  .m.sys { align-self:center; background:none; color:var(--muted); font-size:13px; }
  form { display:flex; gap:8px; padding:10px; background:var(--card); border-top:1px solid var(--other); padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); }
  form input { margin:0; flex:1; }
</style>
</head>
<body>

<div id="login" class="screen active">
  <div class="card">
    <h1>💬 Chat Ruangan</h1>
    <p class="sub">Isi nama dan kode ruangan. Kalau kamu orang pertama, kamu jadi host dan password yang kamu isi dipakai untuk ruangan ini.</p>
    <input id="name" placeholder="Nama kamu" maxlength="20" autocomplete="off">
    <input id="code" placeholder="Kode ruangan" maxlength="20" autocomplete="off">
    <button class="link" id="randBtn" type="button">Buat kode acak</button>
    <input id="pass" type="password" placeholder="Password ruangan" maxlength="30" autocomplete="off">
    <button class="full" id="joinBtn">Masuk</button>
    <div id="err"></div>
  </div>
</div>

<div id="chat" class="screen">
  <header>
    <div><b id="roomTitle"></b><small id="status"></small></div>
    <div class="btns">
      <button id="membersBtn">👥 <span id="count">1</span></button>
      <button id="leaveBtn">Keluar</button>
    </div>
  </header>
  <div id="members"></div>
  <div id="msgs"></div>
  <form id="form">
    <input id="text" placeholder="Ketik pesan..." autocomplete="off">
    <button type="submit">Kirim</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const MAX = 10;
let peer = null, isHost = false, inChat = false, kickedFlag = false;
let myName = '', roomCode = '', roomPass = '', hostConn = null, timer = null;
let clients = [];
let banned = new Set();

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function addMsg(m) {
  const d = document.createElement('div');
  if (m.type === 'sys') {
    d.className = 'm sys';
    d.textContent = m.text;
  } else {
    d.className = 'm' + (m.me ? ' me' : '');
    if (!m.me) {
      const n = document.createElement('div');
      n.className = 'n';
      n.textContent = m.name;
      d.appendChild(n);
    }
    const t = document.createElement('div');
    t.textContent = m.text;
    d.appendChild(t);
  }
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

function memberNames() {
  return [myName].concat(clients.filter(c => c.name).map(c => c.name));
}

function relay(data, exceptConn) {
  clients.forEach(c => {
    if (c.name && c.conn !== exceptConn && c.conn.open) c.conn.send(data);
  });
}

function renderMembers(list) {
  $('count').textContent = list.length;
  const box = $('members');
  box.innerHTML = '';
  list.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'mem';
    const label = document.createElement('span');
    label.textContent = name;
    if (i === 0) {
      const s = document.createElement('small');
      s.textContent = ' (host)';
      label.appendChild(s);
    }
    row.appendChild(label);
    if (isHost && i !== 0) {
      const b = document.createElement('button');
      b.textContent = 'Keluarkan';
      b.onclick = () => kick(name);
      row.appendChild(b);
    }
    box.appendChild(row);
  });
}

function broadcastMembers() {
  const list = memberNames();
  renderMembers(list);
  relay({ type: 'members', list });
}

function enterChat() {
  clearTimeout(timer);
  inChat = true;
  $('roomTitle').textContent = 'Ruangan: ' + roomCode;
  $('msgs').innerHTML = '';
  $('members').classList.remove('open');
  show('chat');
}

function kick(name) {
  const c = clients.find(x => x.name === name);
  if (!c) return;
  banned.add(name.toLowerCase());
  c.kicked = true;
  c.conn.send({ type: 'kicked' });
  setTimeout(() => c.conn.close(), 300);
  clients = clients.filter(x => x !== c);
  const s = { type: 'sys', text: name + ' dikeluarkan' };
  addMsg(s); relay(s); broadcastMembers();
}

function startHost() {
  isHost = true;
  $('status').textContent = 'Kamu host ruangan ini';
  enterChat();
  renderMembers([myName]);
  addMsg({ type: 'sys', text: 'Ruangan dibuat. Bagikan kode "' + roomCode + '"' + (roomPass ? ' dan passwordnya' : '') + ' ke temanmu.' });

  peer.on('connection', conn => {
    const c = { conn, name: null, kicked: false };
    clients.push(c);
    const t = setTimeout(() => { if (!c.name) conn.close(); }, 10000);

    conn.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (!c.name) {
        if (d.type !== 'join') return;
        const nm = String(d.name || '').trim().slice(0, 20);
        const deny = r => {
          conn.send({ type: 'denied', reason: r });
          setTimeout(() => conn.close(), 300);
        };
        if (!nm) return deny('Nama kosong.');
        if (roomPass && d.pass !== roomPass) return deny('Password salah.');
        if (banned.has(nm.toLowerCase())) return deny('Kamu dikeluarkan dari ruangan ini.');
        if (memberNames().some(n => n.toLowerCase() === nm.toLowerCase())) return deny('Nama sudah dipakai.');
        if (memberNames().length >= MAX) return deny('Ruangan penuh.');
        c.name = nm;
        clearTimeout(t);
        conn.send({ type: 'welcome', list: memberNames() });
        const s = { type: 'sys', text: nm + ' bergabung' };
        addMsg(s); relay(s, conn); broadcastMembers();
        return;
      }
      if (d.type === 'msg') {
        const m = { type: 'msg', name: c.name, text: String(d.text || '').slice(0, 1000) };
        addMsg(m); relay(m, conn);
      }
    });

    conn.on('close', () => {
      clearTimeout(t);
      clients = clients.filter(x => x !== c);
      if (c.name && !c.kicked) {
        const s = { type: 'sys', text: c.name + ' keluar' };
        addMsg(s); relay(s); broadcastMembers();
      }
    });
  });
}

function startClient(hostId) {
  peer.destroy();
  peer = new Peer();
  peer.on('error', e => {
    fail(e.type === 'peer-unavailable' ? 'Ruangan tidak ditemukan.' : 'Gagal terhubung: ' + e.type);
  });
  peer.on('open', () => {
    hostConn = peer.connect(hostId, { reliable: true });
    hostConn.on('open', () => {
      hostConn.send({ type: 'join', name: myName, pass: $('pass').value });
    });
    hostConn.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.type === 'denied') {
        fail(d.reason);
      } else if (d.type === 'welcome') {
        $('status').textContent = 'Terhubung';
        enterChat();
        renderMembers(d.list);
      } else if (d.type === 'members') {
        renderMembers(d.list);
      } else if (d.type === 'kicked') {
        kickedFlag = true;
        $('status').textContent = 'Dikeluarkan';
        addMsg({ type: 'sys', text: 'Kamu dikeluarkan oleh host.' });
      } else {
        addMsg(d);
      }
    });
    hostConn.on('close', () => {
      if (inChat && !kickedFlag) {
        addMsg({ type: 'sys', text: 'Host terputus. Ruangan ditutup.' });
        $('status').textContent = 'Terputus';
      }
    });
  });
}

function fail(msg) {
  clearTimeout(timer);
  if (peer) { peer.destroy(); peer = null; }
  inChat = false;
  $('err').textContent = msg;
  show('login');
}

function join() {
  myName = $('name').value.trim();
  roomCode = $('code').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  roomPass = $('pass').value;
  if (!myName || !roomCode) { $('err').textContent = 'Isi nama dan kode ruangan.'; return; }
  $('err').textContent = 'Menghubungkan...';
  kickedFlag = false; isHost = false; clients = []; banned = new Set();
  clearTimeout(timer);
  timer = setTimeout(() => fail('Koneksi terlalu lama. Coba ganti jaringan atau muat ulang halaman.'), 25000);
  const hostId = 'roomchat-v2-' + roomCode;
  peer = new Peer(hostId);
  peer.on('open', () => startHost());
  peer.on('error', e => {
    if (e.type === 'unavailable-id') startClient(hostId);
    else fail('Error: ' + e.type);
  });
}

function leave() {
  clearTimeout(timer);
  if (peer) peer.destroy();
  peer = null; clients = []; hostConn = null; isHost = false; inChat = false;
  show('login');
  $('err').textContent = '';
}

$('randBtn').onclick = () => {
  const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  let s = '';
  for (let i = 0; i < 10; i++) s += chars[Math.floor(Math.random() * chars.length)];
  $('code').value = s;
};
$('joinBtn').onclick = join;
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
$('leaveBtn').onclick = leave;
$('membersBtn').onclick = () => $('members').classList.toggle('open');
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || kickedFlag) return;
  addMsg({ type: 'msg', name: myName, text, me: true });
  if (isHost) relay({ type: 'msg', name: myName, text });
  else if (hostConn && hostConn.open) hostConn.send({ type: 'msg', text });
  $('text').value = '';
});
</script>
</body>
</html>
