<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Ruangan</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --me:#2563eb; --me-text:#fff; --other:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --card:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --accent:#3b82f6; --me:#3b82f6; --me-text:#fff; --other:#374151; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  .screen { display:none; height:100%; }
  .screen.active { display:flex; }
  #login { align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--card); padding:24px; border-radius:16px; width:100%; max-width:380px; box-shadow:0 4px 20px rgba(0,0,0,.1); }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:14px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; background:var(--bg); padding:4px; border-radius:12px; }
  .tabs button { flex:1; background:none; color:var(--muted); padding:10px; font-size:15px; }
  .tabs button.on { background:var(--accent); color:#fff; }
  input { width:100%; padding:12px; margin-bottom:12px; border:1px solid var(--other); border-radius:10px; font-size:16px; background:var(--bg); color:var(--text); }
  button { padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; }
  button.full { width:100%; }
  #err { color:#dc2626; font-size:14px; min-height:20px; margin-top:8px; }
  #chat { flex-direction:column; }
  header { padding:12px 16px; background:var(--card); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--other); gap:8px; }
  header b { font-size:16px; user-select:all; }
  header small { display:block; color:var(--muted); font-size:12px; }
  header .btns { display:flex; gap:8px; }
  header button { padding:8px 12px; font-size:14px; }
  #copyBtn { background:var(--other); color:var(--text); }
  #leaveBtn { background:#dc2626; }
  #msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:80%; padding:8px 12px; border-radius:14px; background:var(--other); word-wrap:break-word; white-space:pre-wrap; }
  .m .n { font-size:12px; color:var(--muted); margin-bottom:2px; }
  .m.me { align-self:flex-end; background:var(--me); color:var(--me-text); }
  .m.sys { align-self:center; background:none; color:var(--muted); font-size:13px; text-align:center; }
  form { display:flex; gap:8px; padding:10px; background:var(--card); border-top:1px solid var(--other); padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); }
  form input { margin:0; flex:1; }
</style>
</head>
<body>

<div id="login" class="screen active">
  <div class="card">
    <h1>💬 Chat Ruangan</h1>
    <p class="sub">Pesan dienkripsi dengan password ruangan.</p>
    <div class="tabs">
      <button id="tabCreate" class="on" type="button">Buat Ruangan</button>
      <button id="tabJoin" type="button">Masuk Ruangan</button>
    </div>
    <input id="name" placeholder="Nama kamu" maxlength="20" autocomplete="off">
    <input id="code" placeholder="Kode ruangan" maxlength="20" autocomplete="off" style="display:none">
    <input id="pass" type="password" placeholder="Password ruangan" maxlength="30" autocomplete="off">
    <button class="full" id="goBtn">Buat Ruangan</button>
    <div id="err"></div>
  </div>
</div>

<div id="chat" class="screen">
  <header>
    <div><b id="roomTitle"></b><small id="status"></small></div>
    <div class="btns">
      <button id="copyBtn">Salin kode</button>
      <button id="leaveBtn">Keluar</button>
    </div>
  </header>
  <div id="msgs"></div>
  <form id="form">
    <input id="text" placeholder="Ketik pesan..." maxlength="500" autocomplete="off">
    <button type="submit">Kirim</button>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);
const SERVER = 'https://ntfy.sh/';
const enc = new TextEncoder(), dec = new TextDecoder();
const myId = Math.random().toString(36).slice(2, 10);

let mode = 'create';
let myName = '', roomCode = '', key = null, topic = '', es = null;
let seen = new Set(), announced = false, bad = 0, goodOthers = 0, warned = false;

function b64(buf) { let s = ''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); }
function unb64(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }

async function sha256hex(s) {
  const h = await crypto.subtle.digest('SHA-256', enc.encode(s));
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function deriveKey(code, pass) {
  const base = await crypto.subtle.importKey('raw', enc.encode(code + '|' + pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode('chat-online-v3'), iterations: 100000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encrypt(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  const out = new Uint8Array(12 + ct.byteLength);
  out.set(iv); out.set(new Uint8Array(ct), 12);
  return b64(out);
}
async function decrypt(str) {
  try {
    const raw = unb64(str);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(dec.decode(pt));
  } catch (e) { return null; }
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function setStatus(t) { $('status').textContent = t; }

function addMsg(m) {
  const d = document.createElement('div');
  if (m.type === 'sys') {
    d.className = 'm sys';
    d.textContent = m.text;
  } else {
    d.className = 'm' + (m.me ? ' me' : '');
    if (!m.me) {
      const n = document.createElement('div');
      n.className = 'n';
      n.textContent = m.name;
      d.appendChild(n);
    }
    const t = document.createElement('div');
    t.textContent = m.text;
    d.appendChild(t);
  }
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

async function send(obj) {
  const body = await encrypt(obj);
  const r = await fetch(SERVER + topic, { method: 'POST', body });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}
function newMid() { return myId + Math.random().toString(36).slice(2, 8) + Date.now().toString(36); }

function connect() {
  es = new EventSource(SERVER + topic + '/sse?since=all');
  es.onopen = () => {
    setStatus('Terhubung');
    if (!announced) {
      announced = true;
      const mid = newMid();
      seen.add(mid);
      send({ mid, sid: myId, type: 'sys', text: myName + ' bergabung' }).catch(() => {});
      setTimeout(() => {
        if (bad > 0 && goodOthers === 0 && !warned) {
          warned = true;
          addMsg({ type: 'sys', text: 'Ada pesan yang tidak bisa dibuka. Password atau kode mungkin salah.' });
        }
      }, 6000);
    }
  };
  es.onerror = () => setStatus('Menyambung ulang...');
  es.onmessage = async ev => {
    let d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.event !== 'message' || !d.message) return;
    const m = await decrypt(d.message);
    if (!m || !m.mid) { bad++; return; }
    if (seen.has(m.mid)) return;
    seen.add(m.mid);
    if (m.sid !== myId) goodOthers++;
    if (m.type === 'sys') addMsg({ type: 'sys', text: m.text });
    else addMsg({ type: 'msg', name: m.name, text: m.text, me: m.sid === myId });
  };
}

function setMode(m) {
  mode = m;
  $('tabCreate').classList.toggle('on', m === 'create');
  $('tabJoin').classList.toggle('on', m === 'join');
  $('code').style.display = m === 'join' ? 'block' : 'none';
  $('goBtn').textContent = m === 'create' ? 'Buat Ruangan' : 'Masuk Ruangan';
  $('err').textContent = '';
}

async function go() {
  const name = $('name').value.trim();
  const pass = $('pass').value;
  let code;
  if (!name) { $('err').textContent = 'Isi nama kamu.'; return; }
  if (mode === 'create') {
    if (pass.length < 4) { $('err').textContent = 'Password minimal 4 karakter.'; return; }
    const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
    const arr = crypto.getRandomValues(new Uint8Array(10));
    code = Array.from(arr).map(n => chars[n % chars.length]).join('');
  } else {
    code = $('code').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    if (!code) { $('err').textContent = 'Isi kode ruangan.'; return; }
    if (!pass) { $('err').textContent = 'Isi password ruangan.'; return; }
  }
  $('err').textContent = 'Menghubungkan...';
  $('goBtn').disabled = true;
  try {
    myName = name; roomCode = code;
    key = await deriveKey(code, pass);
    topic = 'chatonline-' + (await sha256hex(code)).slice(0, 24);
    seen = new Set(); announced = false; bad = 0; goodOthers = 0; warned = false;
    $('msgs').innerHTML = '';
    $('roomTitle').textContent = 'Kode: ' + code;
    setStatus('Menghubungkan...');
    show('chat');
    if (mode === 'create') {
      addMsg({ type: 'sys', text: 'Ruangan dibuat. Bagikan kode "' + code + '" dan passwordnya ke temanmu lewat chat pribadi.' });
    }
    connect();
  } catch (e) {
    $('err').textContent = 'Gagal: ' + e.message;
    show('login');
  }
  $('goBtn').disabled = false;
}

function leave() {
  if (es) { es.close(); es = null; }
  if (key && announced) {
    const mid = newMid();
    send({ mid, sid: myId, type: 'sys', text: myName + ' keluar' }).catch(() => {});
  }
  key = null;
  show('login');
  $('err').textContent = '';
}

$('tabCreate').onclick = () => setMode('create');
$('tabJoin').onclick = () => setMode('join');
$('goBtn').onclick = go;
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
$('leaveBtn').onclick = leave;
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(roomCode); $('copyBtn').textContent = 'Tersalin ✓'; }
  catch (e) { $('copyBtn').textContent = 'Tekan lama kode'; }
  setTimeout(() => $('copyBtn').textContent = 'Salin kode', 2000);
};
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || !key) return;
  $('text').value = '';
  const mid = newMid();
  seen.add(mid);
  addMsg({ type: 'msg', name: myName, text, me: true });
  try { await send({ mid, sid: myId, type: 'msg', name: myName, text }); }
  catch (err) { addMsg({ type: 'sys', text: 'Pesan gagal terkirim. Coba lagi.' }); }
});
</script>
</body>
</html>
